name: Build Browser IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Select Xcode
    run: |
      xcodebuild -version

  - name: Build iOS app
    run: |
      xcodebuild \
        -project Browser.xcodeproj \
        -scheme Browser \
        -sdk iphoneos \
        -configuration Release \
        -derivedDataPath build \
        CODE_SIGNING_ALLOWED=NO \
        build