
name: Build Browser IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          xcodebuild \
            -project Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Browser.app Payload/
          zip -r Browser-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Browser-unsigned-IPA
          path: Browser-unsigned.ipa
